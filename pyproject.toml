[project]
name = "research-loop"
version = "0.3.0"
description = "A Codex-led research loop with native delegation"
requires-python = ">=3.12,<3.13"
dependencies = ["openai-codex==0.167.0", "pydantic>=2.11,<3"]

[project.scripts]
research-loop = "research_loop.loop:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
