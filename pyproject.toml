[project]
name = "research-loop"
version = "0.1.0"
description = "A document-based research loop using Codex or Pi."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dashboard = ["tensorboard==2.21.0"]

[project.scripts]
research-loop = "research_loop.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"

