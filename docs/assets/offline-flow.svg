<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Research Loop: one scripted offline iteration</title>
  <desc id="desc">A fixed scripted harness supplies ten responses. The real Study controller performs selection, plan, execute, review, then publishes reviewed records. No model, network, GPU work, or empirical measurements are involved.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c172a"/><stop offset="1" stop-color="#102b36"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#69cdd6" stroke-width="1.3"/></marker>
    <style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.muted{fill:#b1c6db}.label{fill:#eaf4ff;font-size:21px;font-weight:650}.detail{fill:#b1c6db;font-size:16px}.card{fill:#142d43;stroke:#345775;stroke-width:1.3}</style>
  </defs>
  <rect width="1200" height="540" rx="24" fill="url(#bg)"/>
  <rect x="44" y="40" width="5" height="52" rx="2.5" fill="url(#accent)"/>
  <text x="66" y="63" fill="#f0f7ff" font-size="28" font-weight="700">A research loop you can inspect</text>
  <text x="66" y="91" class="muted" font-size="17">One offline iteration · real controller records · fixed demo responses</text>
  <rect x="44" y="127" width="1112" height="57" rx="13" fill="#103d49" stroke="#28737d"/>
  <text x="66" y="162" fill="#8cf0dc" font-size="17" font-weight="600">SCRIPTED HARNESS</text>
  <text x="288" y="162" fill="#d1f5ef" font-size="17">10 fixed responses · no model / network / GPU calls</text>
  <text x="44" y="224" fill="#8ebcfa" font-size="13" font-weight="700" letter-spacing="2">REAL STUDY CONTROLLER</text>
  <g transform="translate(44 245)">
    <rect width="196" height="111" rx="15" class="card"/>
    <text x="18" y="34" class="label">01  Selection</text>
    <text x="18" y="63" class="detail">Propose · debate</text>
    <text x="18" y="87" class="detail">Judge selects an action</text>
  </g>
  <g transform="translate(272 245)">
    <rect width="196" height="111" rx="15" class="card"/>
    <text x="18" y="34" class="label">02  Plan</text>
    <text x="18" y="63" class="detail">Freeze the contract</text>
    <text x="18" y="87" class="detail">Action · evidence · limit</text>
  </g>
  <g transform="translate(500 245)">
    <rect width="196" height="111" rx="15" class="card"/>
    <text x="18" y="34" class="label">03  Execute</text>
    <text x="18" y="63" class="detail">Retain the derivation</text>
    <text x="18" y="87" class="detail">n(n+1) is even</text>
  </g>
  <g transform="translate(728 245)">
    <rect width="196" height="111" rx="15" class="card"/>
    <text x="18" y="34" class="label">04  Review</text>
    <text x="18" y="63" class="detail">Scripted judgment</text>
    <text x="18" y="87" class="detail">Stop · goal status</text>
  </g>
  <g transform="translate(956 245)">
    <rect width="200" height="111" rx="15" fill="#123e45" stroke="#4ebcab" stroke-width="1.3"/>
    <text x="18" y="34" class="label">05  Publish</text>
    <text x="18" y="63" class="detail">Reviewed records</text>
    <text x="18" y="87" class="detail">Research · route state</text>
  </g>
  <g stroke="#69cdd6" stroke-width="1.5" marker-end="url(#arrow)"><path d="M245 300H262"/><path d="M473 300H490"/><path d="M701 300H718"/><path d="M929 300H946"/></g>
  <path d="M44 390H1156" stroke="#2e4b61"/>
  <text x="44" y="426" fill="#e3eefb" font-size="18" font-weight="600">Read the evidence trail</text>
  <text x="44" y="456" class="muted" font-size="17">context.json → response.json → publication.json → research.md</text>
  <text x="44" y="501" fill="#8caac2" font-size="15">Wiring demonstration only. Prewritten proof and review; no empirical metrics or AeroArm results.</text>
</svg>
